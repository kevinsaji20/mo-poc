spring.config.import=optional:file:../.env[.properties]

spring.application.name=query-service

server.address=${QUERY_SERVICE_HOST}
server.port=${QUERY_SERVICE_PORT}
server.servlet.context-path=${SERVLET_CONTEXT_PATH}

security.jwt.public-key=classpath:keys/public.pem

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/metrics_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

spring.data.redis.env.trends-ttl=2
spring.data.redis.env.metrics-ttl=5
spring.data.redis.env.historical-metrics-ttl=30

# Kafka Broker
spring.kafka.bootstrap-servers=${KAFKA_HOST}:${KAFKA_PORT}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# Kafka-Env
kafka.topic.computed-metrics-events=computed-metrics-events

# Rest-Client
spring.rest.catalog-client-uri=${CATALOG_SERVICE_URI}${SERVLET_CONTEXT_PATH)
