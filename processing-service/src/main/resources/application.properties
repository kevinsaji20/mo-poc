spring.config.import=optional:file:../.env[.properties]

spring.application.name=processing-service

server.address=${PROCESSING_SERVICE_HOST}
server.port=${PROCESSING_SERVICE_PORT}
server.servlet.context-path=${SERVLET_CONTEXT_PATH}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/metrics_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.level.org.flywaydb=DEBUG

# Kafka Broker
spring.kafka.bootstrap-servers=${KAFKA_HOST}:${KAFKA_PORT}

spring.kafka.streams.application-id=processing-service
spring.kafka.streams.properties.processing.guarantee=exactly_once_v2
spring.kafka.streams.state-dir=/tmp/processing-service-kafka-streams

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Env
kafka.topic.raw-engagement-events=raw-engagement-events
kafka.topic.computed-metrics-events=computed-metrics-events
kafka.consumer.metric-persistence=metric-persistence

application.env.watch-time-window=${PROCESSING_WATCH_TIME_WINDOW}