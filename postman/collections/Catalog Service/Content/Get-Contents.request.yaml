$kind: http-request
method: GET
url: "{{gatewayBaseUrl}}/content"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
order: 1000
description: Get all content items. Supports optional filtering by genre, contentType, and contentStatus.
queryParams:
  - key: genre
    value: ""
    disabled: true
  - key: contentType
    value: ""
    disabled: true
  - key: contentStatus
    value: ""
    disabled: true
