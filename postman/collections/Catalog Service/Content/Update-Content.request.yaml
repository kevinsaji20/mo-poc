$kind: http-request
method: POST
url: "{{gatewayBaseUrl}}/content/{{contentId}}"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
order: 4000
description: "Update existing content. Requires CONTENT_ADMIN role. status: DRAFT|PUBLISHED|ARCHIVED"
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: json
  content: |-
    {
      "title": "Updated Video Title",
      "description": "Updated description",
      "contentType": "VIDEO",
      "genre": "ENTERTAINMENT",
      "language": "en",
      "durationSeconds": 3600,
      "thumbnailUrl": "https://example.com/thumbnail.jpg",
      "streamUrl": "https://example.com/stream.m3u8",
      "tags": ["updated", "video"],
      "releaseDate": "2024-01-15",
      "channelName": "Sample Channel",
      "status": "PUBLISHED"
    }
