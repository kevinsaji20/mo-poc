$kind: http-request
method: POST
url: '{{catalogBaseUrl}}/content'
order: 3000
description: "Create new content. Requires CONTENT_ADMIN role. contentType: VIDEO|AUDIO|PODCAST. genre: ENTERTAINMENT|EDUCATION|NEWS|SPORTS|DOCUMENTARY"
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
body:
  type: json
  content: |-
    {
      "title": "Sample Video",
      "description": "A sample video description",
      "contentType": "VIDEO",
      "genre": "ENTERTAINMENT",
      "language": "en",
      "durationSeconds": 3600,
      "thumbnailUrl": "https://example.com/thumbnail.jpg",
      "streamUrl": "https://example.com/stream.m3u8",
      "tags": ["sample", "video"],
      "releaseDate": "2024-01-15",
      "channelName": "Sample Channel"
    }
