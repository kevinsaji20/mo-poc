$kind: http-request
order: 1000
method: POST
url: '{{gatewayBaseUrl}}/auth/signup'
description: Register a new user. provider can be LOCAL or GOOGLE
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "fullName": "John Doe",
      "username": "johndoe",
      "password": "password123",
      "provider": "LOCAL"
    }
