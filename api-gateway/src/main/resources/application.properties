spring.config.import=optional:file:../.env[.properties]

spring.application.name=api-gateway

server.port=8080
server.servlet.context-path=/api/v1

spring.datasource.url=jdbc:postgresql://localhost:5433/auth_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.level.org.flywaydb=DEBUG

security.bcrypt.strength=${BCRYPT_STRENGTH}

security.jwt.auth-token-expiration=${AUTH_JWT_TOKEN_EXPIRES_IN}

security.refresh-token-expiration=${REFRESH_TOKEN_EXPIRES_IN}

security.jwt.auth-private-key=${AUTH_JWT_PRIVATE_KEY}
security.jwt.auth-public-key=${AUTH_JWT_PUBLIC_KEY}
