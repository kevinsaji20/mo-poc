spring.config.import=optional:file:../.env[.properties]

spring.application.name=api-gateway

server.port=8080
spring.main.web-application-type=reactive
spring.webflux.base-path=/api/v1

spring.cloud.gateway.server.webflux.routes[0].id=catalog-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/content/**

security.jwt.public-key=classpath:keys/public.pem

spring.datasource.url=jdbc:postgresql://localhost:5433/auth_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.level.org.flywaydb=DEBUG

security.bcrypt.strength=${BCRYPT_STRENGTH}

security.jwt.auth-token-expiration=${AUTH_JWT_TOKEN_EXPIRES_IN}

security.refresh-token-expiration=${REFRESH_TOKEN_EXPIRES_IN}

spring.cloud.gateway.server.webflux.filter.json-to-grpc.enabled=false