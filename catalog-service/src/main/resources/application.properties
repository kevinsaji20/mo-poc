spring.config.import=optional:file:../.env[.properties]

spring.application.name=catalog-service

server.port=8081
server.servlet.context-path=/api/v1

security.jwt.public-key=classpath:keys/public.pem

spring.datasource.url=jdbc:postgresql://localhost:5433/catalog_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.level.org.flywaydb=DEBUG

# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#Env

kafka.topic.content-published=content-published
kafka.topic.content-archived=content-archived
